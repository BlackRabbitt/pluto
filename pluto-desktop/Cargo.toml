[package]
name = "pluto-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pluto-desktop"
path = "src/main.rs"

[dependencies]
pluto = { path = "../pluto" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { version = "0.21.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "sync"] }
